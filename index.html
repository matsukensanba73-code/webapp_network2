<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1180, initial-scale=1.0">
<title>IPアドレスと通信の仕組み ― 学習アプリ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ========================= ヘッダー ========================= -->
<header class="app-header">
  <div class="header-inner">
    <div class="header-text">
      <h1>IPアドレスと通信の仕組み</h1>
      <p class="header-sub">高校 情報Ⅰ ― 自分のPCから、目的の相手にデータが届くまで</p>
    </div>
    <div class="header-badge">体験学習アプリ</div>
  </div>
</header>

<!-- ========================= メイン ========================= -->
<main class="app-main">

  <!-- 進行状況 -->
  <section class="card progress-card" aria-label="進行状況">
    <div class="progress-top">
      <div class="progress-step" id="progressStepText">STEP 1 / 5</div>
      <div class="progress-scene" id="progressSceneText">宛先を確認する</div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
      <div class="progress-ticks" id="progressTicks"></div>
    </div>
  </section>

  <!-- ネットワーク図 -->
  <section class="card diagram-card" aria-label="ネットワーク図">
    <h2 class="card-title">ネットワーク図</h2>

    <div class="diagram-frame">
      <svg id="networkSvg" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

        <!-- LAN境界 -->
        <rect id="lanBoundary" class="lan-boundary" x="20" y="40" width="450" height="330" rx="20" ry="20"></rect>
        <text class="lan-boundary-label" x="40" y="66">LAN内部（192.168.1.0/24）</text>

        <!-- 接続線（機器より先に描画し、下に配置） -->
        <line id="linePcLanpc" class="conn-line" x1="135" y1="194" x2="135" y2="258"></line>
        <line id="linePcRouter" class="conn-line" x1="182" y1="140" x2="440" y2="200"></line>
        <line id="lineRouterInternet" class="conn-line" x1="590" y1="200" x2="637" y2="188"></line>
        <line id="lineInternetServer" class="conn-line" x1="742" y1="188" x2="800" y2="155"></line>

        <!-- 自分のPC -->
        <g id="devPc" class="device">
          <rect class="device-body" x="90" y="110" width="90" height="60" rx="6"></rect>
          <rect class="device-body-sub" x="125" y="170" width="20" height="14"></rect>
          <rect class="device-body-sub" x="110" y="184" width="50" height="8" rx="4"></rect>
          <text class="device-label" x="135" y="212">自分のPC</text>
          <text class="ip-label" x="135" y="231">192.168.1.10</text>
        </g>

        <!-- 同じLAN内のPC -->
        <g id="devLanPc" class="device">
          <rect class="device-body" x="90" y="260" width="90" height="60" rx="6"></rect>
          <rect class="device-body-sub" x="125" y="320" width="20" height="14"></rect>
          <rect class="device-body-sub" x="110" y="334" width="50" height="8" rx="4"></rect>
          <text class="device-label" x="135" y="362">同じLAN内のPC</text>
          <text class="ip-label" x="135" y="381">192.168.1.20</text>
        </g>

        <!-- ルータ -->
        <g id="devRouter" class="device">
          <text class="device-label router-title" x="515" y="140">ルータ</text>
          <rect class="device-body router-body" x="440" y="150" width="150" height="100" rx="14"></rect>
          <text class="router-icon" x="515" y="209" text-anchor="middle">⇄</text>

          <g id="routerLanSide" class="router-side">
            <text class="side-label" x="450" y="272">LAN側</text>
            <text class="ip-label" id="routerLanIp" x="450" y="291">192.168.1.1</text>
          </g>
          <g id="routerWanSide" class="router-side">
            <text class="side-label" x="580" y="272" text-anchor="end">WAN側</text>
            <text class="ip-label" id="routerWanIp" x="580" y="291" text-anchor="end">203.0.113.10</text>
          </g>
        </g>

        <!-- インターネット -->
        <g id="devInternet" class="device">
          <path class="cloud-body" d="M650,210 C638,210 628,200 628,188 C628,175 638,167 649,167
                   C651,153 665,143 682,143 C699,143 712,153 716,168
                   C730,166 743,176 743,191 C743,205 731,216 716,216 Z"></path>
          <text class="device-label" x="685" y="238">インターネット</text>
        </g>

        <!-- Webサーバ -->
        <g id="devServer" class="device">
          <rect class="device-body server-body" x="800" y="110" width="70" height="90" rx="8"></rect>
          <line class="server-line" x1="800" y1="133" x2="870" y2="133"></line>
          <line class="server-line" x1="800" y1="156" x2="870" y2="156"></line>
          <line class="server-line" x1="800" y1="179" x2="870" y2="179"></line>
          <circle class="server-led" cx="812" cy="121" r="3"></circle>
          <circle class="server-led" cx="812" cy="144" r="3"></circle>
          <circle class="server-led" cx="812" cy="167" r="3"></circle>
          <text class="device-label" x="835" y="217">Webサーバ</text>
          <text class="ip-label" x="835" y="236">198.51.100.20</text>
        </g>

        <!-- NAT変換ポップアップ（通常は非表示） -->
        <g id="natPopup" class="nat-popup is-hidden">
          <rect x="368" y="8" width="290" height="54" rx="12"></rect>
          <text class="nat-before" x="384" y="41">192.168.1.10</text>
          <text class="nat-arrow" x="513" y="41" text-anchor="middle">NAT変換</text>
          <text class="nat-after" x="642" y="41" text-anchor="end">203.0.113.10</text>
        </g>

        <!-- パケット（移動アニメーションの主役） -->
        <g id="packet" class="packet is-hidden">
          <rect x="-12" y="-8" width="24" height="16" rx="4"></rect>
          <text id="packetLabel" x="0" y="-14" text-anchor="middle"></text>
        </g>

      </svg>
    </div>

    <!-- IPアドレスの内訳（サブネットマスクの説明時のみ表示） -->
    <div class="ip-breakdown is-hidden" id="ipBreakdown">
      <div class="breakdown-title">IPアドレスの内訳（サブネットマスクで判断する部分）</div>
      <div class="breakdown-rows" id="breakdownRows"></div>
      <div class="breakdown-legend">
        <span class="legend-chip legend-net"></span>ネットワーク部（一致するか確認する部分）
        <span class="legend-chip legend-host"></span>ホスト部（機器ごとに異なる部分）
      </div>
    </div>
  </section>

  <!-- 問題・解説 -->
  <section class="card qa-card" aria-label="問題と解説">
    <div id="qaContent"><!-- JavaScriptにより動的に生成 --></div>
  </section>

  <!-- 操作パネル -->
  <div class="controls">
    <button id="btnRestart" class="btn btn-ghost" type="button">最初からやり直す</button>
    <div class="controls-right">
      <button id="btnPrev" class="btn btn-secondary" type="button">← 前へ</button>
      <button id="btnNext" class="btn btn-primary" type="button" disabled>次へ →</button>
    </div>
  </div>

</main>

<footer class="app-footer">
  <p>高校「情報Ⅰ」学習教材 ／ IPアドレス・サブネットマスク・デフォルトゲートウェイ・NATの流れを体験します</p>
</footer>

<script src="script.js"></script>
</body>
</html>
