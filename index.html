<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通信のしくみを体験する ― IPアドレスとネットワーク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ ヘッダー ============ -->
<header class="app-header">
  <div class="app-header__inner">
    <div class="app-header__title">
      <span class="app-header__eyebrow">情報Ⅰ 学習教材</span>
      <h1>自分のPCから、目的の相手にデータが届くまで</h1>
    </div>
    <div class="app-header__progress" id="progressDots" aria-label="学習の進行状況">
      <!-- JSでSTEP1〜5のドットとラベルを生成 -->
    </div>
  </div>
</header>

<!-- ============ メイン ============ -->
<main class="app-main">

  <!-- ---- 左カラム：ネットワーク図 ---- -->
  <section class="panel panel--diagram" aria-label="ネットワーク図">
    <div class="panel__head">
      <h2>ネットワーク全体図</h2>
      <span class="panel__hint" id="diagramHint">送信元と宛先の関係に注目しましょう</span>
    </div>

    <div class="diagram-wrap">
      <svg id="netSvg" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="netSvgTitle">
        <title id="netSvgTitle">自分のPC・同じLAN内のPC・ルータ・インターネット・Webサーバの接続図</title>

        <!-- 接続線（先に描画して機器の下に） -->
        <g class="links">
          <path id="link-pc1-pc2" class="link" d="M 95 300 L 95 90"></path>
          <path id="link-pc1-router" class="link" d="M 150 300 L 345 235"></path>
          <path id="link-pc2-router" class="link" d="M 150 90 L 345 165"></path>
          <path id="link-router-internet" class="link" d="M 470 200 L 610 200"></path>
          <path id="link-internet-server" class="link" d="M 690 200 L 800 200"></path>
        </g>

        <!-- 自分のPC -->
        <g id="node-pc1" class="node node--pc">
          <rect class="node__ring" x="30" y="262" width="130" height="80" rx="14"></rect>
          <rect class="pc__screen" x="45" y="275" width="100" height="62" rx="6"></rect>
          <rect class="pc__inner" x="52" y="282" width="86" height="42" rx="3"></rect>
          <rect class="pc__stand" x="80" y="337" width="30" height="6" rx="2"></rect>
          <text class="node__label" x="95" y="360" text-anchor="middle">自分のPC</text>
          <text class="node__ip" id="ip-pc1" x="95" y="378" text-anchor="middle">192.168.1.10</text>
        </g>

        <!-- 同じLAN内のPC -->
        <g id="node-pc2" class="node node--pc">
          <rect class="node__ring" x="30" y="52" width="130" height="80" rx="14"></rect>
          <rect class="pc__screen" x="45" y="65" width="100" height="62" rx="6"></rect>
          <rect class="pc__inner" x="52" y="72" width="86" height="42" rx="3"></rect>
          <rect class="pc__stand" x="80" y="127" width="30" height="6" rx="2"></rect>
          <text class="node__label" x="95" y="18" text-anchor="middle">同じLAN内のPC</text>
          <text class="node__ip" id="ip-pc2" x="95" y="150" text-anchor="middle">192.168.1.20</text>
        </g>

        <!-- ルータ -->
        <g id="node-router" class="node node--router">
          <rect class="node__ring" x="345" y="150" width="150" height="100" rx="16"></rect>
          <rect class="router__body" x="360" y="175" width="120" height="50" rx="8"></rect>
          <circle class="router__port" cx="378" cy="200" r="5"></circle>
          <circle class="router__port" cx="398" cy="200" r="5"></circle>
          <circle class="router__port" cx="418" cy="200" r="5"></circle>
          <line class="router__antenna" x1="440" y1="175" x2="440" y2="160"></line>
          <line class="router__antenna" x1="460" y1="175" x2="460" y2="160"></line>
          <text class="node__label" x="420" y="270" text-anchor="middle">ルータ</text>
          <g id="router-ip-box">
            <text class="node__ip node__ip--small" x="420" y="140" text-anchor="middle">LAN側 <tspan id="ip-router-lan">192.168.1.1</tspan></text>
            <text class="node__ip node__ip--small" id="ip-router-wan-label" x="420" y="290" text-anchor="middle">WAN側 <tspan id="ip-router-wan">未確定</tspan></text>
          </g>
        </g>

        <!-- インターネット -->
        <g id="node-internet" class="node node--internet">
          <path class="cloud" d="M 615 210
            a 28 28 0 0 1 4 -55
            a 34 34 0 0 1 64 -10
            a 26 26 0 0 1 8 65
            z"></path>
          <text class="node__label" x="650" y="255" text-anchor="middle">インターネット</text>
        </g>

        <!-- Webサーバ -->
        <g id="node-server" class="node node--server">
          <rect class="node__ring" x="800" y="150" width="90" height="100" rx="14"></rect>
          <rect class="server__body" x="815" y="163" width="60" height="74" rx="6"></rect>
          <line class="server__row" x1="823" y1="178" x2="867" y2="178"></line>
          <line class="server__row" x1="823" y1="194" x2="867" y2="194"></line>
          <line class="server__row" x1="823" y1="210" x2="867" y2="210"></line>
          <circle class="server__led" cx="860" cy="224" r="3"></circle>
          <text class="node__label" x="845" y="270" text-anchor="middle">Webサーバ</text>
          <text class="node__ip" id="ip-server" x="845" y="288" text-anchor="middle">198.51.100.20</text>
        </g>

        <!-- パケット（JSで座標を制御） -->
        <rect id="packet" class="packet" x="0" y="0" width="18" height="14" rx="3" style="opacity:0;"></rect>
      </svg>
    </div>

    <!-- NAT変換ミニパネル（STEP4でのみ表示） -->
    <div class="nat-panel" id="natPanel" hidden>
      <div class="nat-panel__title">ルータ内部：NATによるIPアドレス変換</div>
      <div class="nat-panel__row">
        <span class="nat-tag nat-tag--before">変換前（プライベートIP）</span>
        <span class="nat-ip" id="natBefore">192.168.1.10</span>
      </div>
      <div class="nat-panel__arrow">↓ NAT ↓</div>
      <div class="nat-panel__row">
        <span class="nat-tag nat-tag--after">変換後（グローバルIP）</span>
        <span class="nat-ip nat-ip--after" id="natAfter">203.0.113.10</span>
      </div>
    </div>
  </section>

  <!-- ---- 右カラム：問題・解説 ---- -->
  <section class="panel panel--problem" aria-label="問題と解説">
    <div class="panel__head">
      <h2 id="stageTitle">宛先を確認する</h2>
      <span class="badge" id="stageBadge">STEP 1 / 5</span>
    </div>

    <!-- 通信条件の表示 -->
    <div class="info-card" id="infoCard">
      <!-- JSで生成 -->
    </div>

    <!-- 設問エリア -->
    <div class="question-card" id="questionCard" hidden>
      <p class="question-card__prompt" id="questionPrompt"></p>
      <div class="question-card__options" id="questionOptions"></div>
      <div class="feedback" id="feedback" hidden></div>
    </div>

    <!-- アクション（送信ボタンなど） -->
    <div class="action-card" id="actionCard" hidden>
      <button class="btn btn--send" id="sendBtn" type="button"></button>
    </div>

    <!-- 解説エリア -->
    <div class="explain-card" id="explainCard" hidden></div>

    <!-- まとめ画面用の用語リスト -->
    <div class="glossary" id="glossary" hidden></div>
  </section>
</main>

<!-- ============ フッターナビ ============ -->
<footer class="app-footer">
  <button class="btn btn--ghost" id="restartBtn" type="button">最初からやり直す</button>
  <div class="app-footer__nav">
    <button class="btn btn--outline" id="prevBtn" type="button">← 前へ</button>
    <button class="btn btn--primary" id="nextBtn" type="button" disabled>次へ →</button>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
